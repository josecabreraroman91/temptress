<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tienda · inventario y pedidos v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* ===================== TEMA (configurable por tienda) ===================== */
:root{
  --bg:#100B0F; --bg2:#191219; --card:#201820; --card2:#251C25; --line:#38293440;
  --line-s:#3A2C36; --ink:#F6EEF2; --muted:#A38E9A; --muted2:#7C6874;
  --brand:#8E1F35; --brand2:#B8283F; --brand-soft:#2A1620;
  --gold:#E8C87E; --gold-d:#C9A85E; --ok:#4CB07B; --warn:#D7A23F; --bad:#D0463A;
  --r:16px; --r-s:11px;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.55);
  --shadow-lg:0 12px 40px -12px rgba(0,0,0,.7);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --script:"Great Vibes","Segoe Script",cursive;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sidew:246px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);
  background-image:radial-gradient(120% 60% at 100% 0%,rgba(142,31,53,.10),transparent 60%);
  background-attachment:fixed}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
input,select,textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg2);
  border:1px solid var(--line-s);border-radius:var(--r-s);padding:11px 12px;appearance:none;-webkit-appearance:none;transition:border-color .15s,box-shadow .15s}
input:focus,select,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(184,40,63,.22)}
::placeholder{color:var(--muted2)}
label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field{margin-bottom:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.btn{border:none;font-weight:700;padding:12px 16px;border-radius:var(--r-s);width:100%;transition:transform .12s,filter .15s,box-shadow .15s;font-size:14.5px}
.btn-brand{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;box-shadow:0 6px 18px -8px rgba(184,40,63,.8)}
.btn-brand:hover{filter:brightness(1.08)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#2A1620;box-shadow:0 6px 18px -9px rgba(232,200,126,.7)}
.btn-gold:hover{filter:brightness(1.05)}
.btn-ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line-s)}
.btn-ghost:hover{border-color:var(--muted2);background:var(--card)}
.btn-danger{background:transparent;color:var(--bad);border:1px solid rgba(208,70,58,.5)}
.btn-danger:hover{background:rgba(208,70,58,.1)}
.btn:active{transform:scale(.98)}
.btn-row{display:flex;gap:9px;margin:11px 0}
.linkbtn{background:none;border:none;color:var(--gold);font-size:12.5px;font-weight:700;padding:2px 4px}
.linkbtn:hover{text-decoration:underline}
.linkbtn.del{color:var(--bad)}

/* ===================== ESTRUCTURA (shell responsive) ===================== */
.shell{display:flex;min-height:100vh}

/* barra lateral (escritorio) */
.side{display:none}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:13px;background:var(--satin);background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center;font-family:var(--script);color:var(--gold);font-size:34px;line-height:0;padding-bottom:4px;flex:0 0 auto;
  overflow:hidden;box-shadow:inset 0 0 0 1px rgba(232,200,126,.4),0 3px 14px rgba(0,0,0,.55);text-shadow:0 0 12px rgba(232,200,126,.6)}
.logo img{width:100%;height:100%;object-fit:cover}
body:not(.has-logo) .logo{display:none}   /* sin logo propio: solo el nombre sobre el satén */
.htit{flex:1;min-width:0}
.htit b{display:block;font-family:var(--script);font-weight:400;font-size:30px;line-height:1.15;letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:clip;color:var(--gold);text-shadow:0 0 16px rgba(232,200,126,.5)}
.htit span{display:block;font-size:9.5px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);margin-top:-2px}
.eyebtn{background:var(--card2);border:1px solid var(--line-s);color:var(--muted);border-radius:11px;
  width:42px;height:42px;font-size:17px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:.15s}
.eyebtn:hover{border-color:var(--muted2)}
.eyebtn.on{background:var(--gold);color:#2A1620;border-color:var(--gold)}

/* topbar (celular) */
.topbar{position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,rgba(16,11,15,.35),rgba(16,11,15,.82)),var(--satin);
  background-size:cover;background-position:center 30%;
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line-s);padding:13px 16px}
.htop{display:flex;align-items:center;gap:12px}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
main{padding:16px 16px 92px;max-width:840px;margin:0 auto;width:100%}
.card{background:var(--card);border:1px solid var(--line-s);border-radius:var(--r);margin-bottom:11px;box-shadow:var(--shadow);overflow:hidden}
.card.pad{padding:16px}
.sectit{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.1px;color:var(--ink);margin:22px 2px 10px;display:flex;align-items:center;gap:9px}
.sectit .cnt{background:var(--card2);border:1px solid var(--line-s);color:var(--muted);border-radius:99px;padding:2px 9px;font-size:11px;font-family:var(--sans);font-weight:700}
.empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13.5px}

/* nav inferior (celular) */
.botnav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(25,18,25,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line-s);display:flex;padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.botnav button{flex:1;background:none;border:none;color:var(--muted);font-size:10px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:11px;transition:.15s;position:relative}
.botnav button i{font-size:19px;font-style:normal;line-height:1}
.botnav button.on{color:var(--gold)}

/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.kpi{background:var(--card);border:1px solid var(--line-s);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--serif);font-size:23px;font-weight:600;margin-top:6px;letter-spacing:-.2px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi.hero{grid-column:1/-1;background:
  radial-gradient(140% 120% at 0% 0%,rgba(142,31,53,.45),transparent 55%),linear-gradient(135deg,var(--brand-soft),var(--card));
  border-color:rgba(142,31,53,.6)}
.kpi.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,200,126,.16),transparent 70%)}
.kpi.hero .k{color:var(--gold)}
.kpi.hero .v{font-size:33px;color:var(--gold);margin-top:7px}

/* navegador de meses */
.mesnav{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 4px}
.mesbtn{width:38px;height:38px;border-radius:11px;background:var(--card2);border:1px solid var(--line-s);color:var(--ink);
  font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.15s}
.mesbtn:hover{border-color:var(--gold-d);color:var(--gold)}
.mescur{min-width:190px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.mescur .mes{font-family:var(--serif);font-size:18px;font-weight:600;text-transform:capitalize;letter-spacing:.1px}

/* producto */
.prod{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-s);align-items:center;transition:background .13s}
.prod:last-child{border-bottom:none}
.prod[onclick]:hover{background:var(--card2);cursor:pointer}
.thumb{width:54px;height:54px;border-radius:12px;background:var(--bg2);border:1px solid var(--line-s);flex:0 0 auto;
  overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pright{text-align:right;flex:0 0 auto}
.pprice{font-weight:700;font-size:14.5px;font-family:var(--serif)}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.3px;padding:3px 8px;border-radius:99px;border:1px solid}
.c-ok{color:var(--ok);border-color:rgba(76,176,123,.45);background:rgba(76,176,123,.12)}
.c-low{color:var(--warn);border-color:rgba(215,162,63,.5);background:rgba(215,162,63,.12)}
.c-out{color:var(--bad);border-color:rgba(208,70,58,.5);background:rgba(208,70,58,.12)}
.c-gold{color:var(--gold);border-color:rgba(232,200,126,.4);background:rgba(232,200,126,.1)}

/* pedidos */
.ped{padding:13px 14px;border-bottom:1px solid var(--line-s);transition:background .13s}
.ped:last-child{border-bottom:none}
.ped[onclick]:hover{background:var(--card2);cursor:pointer}
.pedtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pedcli{font-weight:700;font-size:14.5px}
.pedtot{font-weight:700;font-size:15px;white-space:nowrap;font-family:var(--serif)}
.pedsub{font-size:11.5px;color:var(--muted);margin-top:4px}
.estados{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.est{font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:99px;border:1px solid var(--line-s);background:var(--bg2);color:var(--muted);transition:.13s}
.est:hover{border-color:var(--muted2)}
.est.on{background:var(--gold);color:#2A1620;border-color:var(--gold)}

/* modal */
.ovl{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--bg2);border:1px solid var(--line-s);border-radius:22px 22px 0 0;width:100%;max-width:600px;
  max-height:93vh;overflow-y:auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg)}
.grab{width:40px;height:4px;background:var(--line-s);border-radius:99px;margin:6px auto 14px}
.sheet h3{margin:0 0 16px;font-family:var(--serif);font-weight:600;font-size:21px}
@media(min-width:700px){.ovl{align-items:center;padding:24px}.sheet{border-radius:20px;max-height:88vh}.grab{display:none}}

/* filtros */
.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;margin-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:var(--card2);border:1px solid var(--line-s);color:var(--muted);border-radius:99px;
  padding:8px 15px;font-size:12.5px;font-weight:700;white-space:nowrap;flex:0 0 auto;transition:.13s}
.tabs button:hover{border-color:var(--muted2);color:var(--ink)}
.tabs button.on{background:linear-gradient(135deg,var(--brand2),var(--brand));border-color:var(--brand2);color:#fff}

/* modo discreto */
body.discreto .thumb img,body.discreto .catimg{filter:blur(10px) saturate(.4)}
body.discreto .disc-hide{filter:blur(5px)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:99;
  background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#2A1620;
  font-weight:700;font-size:13.5px;padding:12px 20px;border-radius:13px;box-shadow:var(--shadow-lg);
  opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;bottom:98px}

/* catálogo */
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(min-width:600px){.catgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.catgrid{grid-template-columns:repeat(4,1fr)}}
.catcard{background:var(--card);border:1px solid var(--line-s);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.catcard:hover{transform:translateY(-3px);border-color:var(--gold-d)}
.catimg{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bg2);display:block}
.catbody{padding:10px 11px}
.catname{font-size:12.5px;font-weight:700;line-height:1.3;min-height:32px}
.catprice{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--gold);margin-top:4px}

/* ===================== ESCRITORIO ===================== */
@media(min-width:960px){
  body{padding-bottom:0}
  .side{display:flex;flex-direction:column;width:var(--sidew);flex:0 0 var(--sidew);
    position:sticky;top:0;height:100vh;padding:26px 18px 22px;gap:8px;
    background:linear-gradient(180deg,rgba(16,11,15,.25),rgba(16,11,15,.9) 210px,var(--bg) 260px),var(--satin);
    background-size:cover;background-position:top center;background-repeat:no-repeat;border-right:1px solid var(--line-s)}
  .side .brand{padding:2px 6px 10px}
  .sidenav{display:flex;flex-direction:column;gap:3px;margin-top:20px}
  .sidenav button{display:flex;align-items:center;gap:13px;background:none;border:none;color:var(--muted);
    font-size:14.5px;font-weight:600;padding:11px 13px;border-radius:12px;text-align:left;transition:.14s;position:relative}
  .sidenav button i{font-size:18px;font-style:normal;width:22px;text-align:center}
  .sidenav button:hover{background:var(--card);color:var(--ink)}
  .sidenav button.on{background:linear-gradient(135deg,rgba(142,31,53,.35),rgba(142,31,53,.12));color:var(--ink)}
  .sidenav button.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
  .side .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--line-s);color:var(--muted);font-size:12px}
  .topbar{display:none}
  .botnav{display:none}
  main{padding:30px 34px 40px;max-width:1120px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi.hero{grid-column:span 2}
  .kpi.hero .v{font-size:36px}
  .catgrid,.kpis{gap:14px}
  .mesnav{justify-content:flex-start}
  .sheet{max-width:640px}
}
@media(min-width:960px) and (max-width:1200px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi.hero{grid-column:span 2}
}

/* ===================== PANTALLA DE ACCESO ===================== */
.gate{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:34px 22px;text-align:center;
  background:radial-gradient(120% 90% at 50% 0%,rgba(20,12,16,.20),rgba(12,8,11,.66) 62%,rgba(9,6,8,.95) 100%),var(--satin);
  background-size:cover;background-position:center}
.gate.oculto{display:none}
.gate-wrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}
.gate-logo{width:min(72vw,300px);height:auto;filter:drop-shadow(0 0 20px rgba(232,200,126,.32));display:block}
.gate-sub{margin-top:14px;font-size:12px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--muted)}
.gate-rule{width:54px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:26px 0 22px;opacity:.7}
#gateBody{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.gate-tag{font-family:var(--serif);font-size:16px;font-weight:500;color:var(--ink);opacity:.92;margin-bottom:22px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;max-width:340px;
  background:#fff;color:#1f1f1f;border:none;border-radius:13px;padding:14px 18px;font-size:15px;font-weight:600;
  cursor:pointer;box-shadow:0 10px 30px -12px rgba(0,0,0,.8);transition:transform .12s,filter .15s}
.gbtn:hover{filter:brightness(.97)}.gbtn:active{transform:scale(.98)}
.gbtn svg{width:20px;height:20px;flex:0 0 auto}
.gate-msg{font-size:13.5px;color:var(--muted);line-height:1.6;max-width:320px}
.gate-msg b{color:var(--ink)}
.gate-mail{font-size:12.5px;color:var(--gold);margin-top:2px;word-break:break-all}
.gate-foot{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:1px;color:rgba(201,179,190,.6)}
.gate-foot b{color:var(--gold);font-weight:700}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(232,200,126,.25);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* mientras carga, ocultar la app por detrás del gate */
body.cargando .shell, body.cargando .botnav{visibility:hidden}
</style>
</head>

</nav>

<div id="modal"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>
/* =======================================================================
   TIENDA · inventario + pedidos · v1
   App de un solo archivo. Hoy guarda en localStorage (modo local);
   la estructura de datos ya está pensada para colgar de Firebase
   en tiendas/<tiendaId>/ sin rehacer la interfaz.
   MULTI-TIENDA: nada acá está atado a un cliente puntual. El nombre,
   el logo y los colores salen de S.tienda (Ajustes).
   ======================================================================= */

/* ---------------------- cálculos de stock y plata ---------------------- */
/* Un producto puede tener variantes (talle/color). Si las tiene, el stock
   real es la suma de las variantes; si no, el stock propio. */
function stockDe(p){
  if(p.variantes&&p.variantes.length) return p.variantes.reduce((a,v)=>a+(Number(v.stock)||0),0);
  return Number(p.stock)||0;
}
function nivelStock(p){
  const s=stockDe(p), min=(p.minimo!=null?p.minimo:S.ajustes.minimoDefault);
  if(s<=0)return 'out'; if(s<=min)return 'low'; return 'ok';
}
function prod(id){ return S.productos.find(p=>p.id===id); }
/* Los pedidos cuentan como venta cuando NO están cancelados. La ganancia
   se cuenta sobre los ya cobrados (plata en mano). */
const ESTADOS=['nuevo','preparado','enviado','cobrado'];
const ESTLABEL={nuevo:'Nuevo',preparado:'Preparado',enviado:'Enviado',cobrado:'Cobrado',cancelado:'Cancelado'};
function totalPed(pd){
  const items=(pd.items||[]).reduce((a,i)=>a+(Number(i.precio)||0)*(Number(i.cant)||0),0);
  const envCli=(pd.envio&&pd.envio.loPaga==='cliente')?(Number(pd.envio.costo)||0):0;
  return items+envCli;
}
function costoPed(pd){
  const c=(pd.items||[]).reduce((a,i)=>a+(Number(i.costo)||0)*(Number(i.cant)||0),0);
  const envMio=(pd.envio&&pd.envio.loPaga==='tienda')?(Number(pd.envio.costo)||0):0;
  return c+envMio;
}
function gananciaPed(pd){ return totalPed(pd)-costoPed(pd); }
function pedidosDe(ym){ return S.pedidos.filter(p=>(p.fecha||'').slice(0,7)===ym && p.estado!=='cancelado'); }

function resumenMes(ym){
  const ps=pedidosDe(ym);
  const cobrados=ps.filter(p=>p.estado==='cobrado');
  const vendido=ps.reduce((a,p)=>a+totalPed(p),0);
  const ganancia=cobrados.reduce((a,p)=>a+gananciaPed(p),0);
  const porCobrar=ps.filter(p=>p.estado!=='cobrado').reduce((a,p)=>a+totalPed(p),0);
  const inv=S.productos.reduce((a,p)=>a+stockDe(p)*(Number(p.costo)||0),0);
  return {n:ps.length,vendido,ganancia,porCobrar,inv,cobrados:cobrados.length};
}
/* Lo más vendido del mes, por unidades */
function topProductos(ym,lim){
  const c={};
  pedidosDe(ym).forEach(p=>(p.items||[]).forEach(i=>{c[i.prodId]=(c[i.prodId]||0)+(Number(i.cant)||0);}));
  return Object.keys(c).map(id=>({p:prod(id),n:c[id]})).filter(x=>x.p).sort((a,b)=>b.n-a.n).slice(0,lim||5);
}
/* Plata dormida: con stock pero sin ventas en los últimos 60 días */
function plataDormida(){
  const lim=new Date();lim.setDate(lim.getDate()-60);
  const limS=lim.toISOString().slice(0,10);
  const vendidos=new Set();
  S.pedidos.filter(p=>p.estado!=='cancelado'&&(p.fecha||'')>=limS)
    .forEach(p=>(p.items||[]).forEach(i=>vendidos.add(i.prodId)));
  return S.productos.filter(p=>stockDe(p)>0&&!vendidos.has(p.id))
    .map(p=>({p,plata:stockDe(p)*(Number(p.costo)||0)})).sort((a,b)=>b.plata-a.plata);
}

  const ym=mesActivo||ymHoy(), R=resumenMes(ym);
  const bajos=S.productos.filter(p=>nivelStock(p)!=='ok').sort((a,b)=>stockDe(a)-stockDe(b));
  const top=topProductos(ym,4);
  const dormida=plataDormida().slice(0,3);
  const pend=S.pedidos.filter(p=>p.estado!=='cobrado'&&p.estado!=='cancelado');

  let h=selectorMes()+'<div class="kpis">';
  h+='<div class="kpi hero"><div class="k">Ganancia del mes</div><div class="v num">'+gs(R.ganancia)+'</div>'+
     '<div class="s">de '+R.cobrados+' pedido'+(R.cobrados===1?'':'s')+' ya cobrado'+(R.cobrados===1?'':'s')+'</div></div>';
  h+='<div class="kpi"><div class="k">Vendido</div><div class="v num">'+gsCorto(R.vendido)+'</div><div class="s">'+R.n+' pedidos</div></div>';
  h+='<div class="kpi"><div class="k">Por cobrar</div><div class="v num" style="color:'+(R.porCobrar>0?'var(--warn)':'inherit')+'">'+gsCorto(R.porCobrar)+'</div><div class="s">'+pend.length+' pendientes</div></div>';
  h+='<div class="kpi"><div class="k">Invertido en stock</div><div class="v num">'+gsCorto(R.inv)+'</div><div class="s">'+S.productos.length+' productos</div></div>';
  h+='<div class="kpi"><div class="k">Para reponer</div><div class="v num" style="color:'+(bajos.length?'var(--bad)':'var(--ok)')+'">'+bajos.length+'</div><div class="s">'+(bajos.length?'necesitan compra':'todo con stock')+'</div></div>';
  h+='</div>';

  if(bajos.length){
    h+='<div class="sectit">⚠️ Hay que reponer <span class="cnt">'+bajos.length+'</span></div><div class="card">';
    h+=bajos.slice(0,6).map(p=>filaProd(p,true)).join('');
    h+='</div>';
  }
  if(pend.length){
    h+='<div class="sectit">Pedidos abiertos <span class="cnt">'+pend.length+'</span></div><div class="card">';
    h+=pend.slice(0,4).map(filaPed).join('')+'</div>';
  }
  if(top.length){
    h+='<div class="sectit">Lo que más sale este mes</div><div class="card">';
    h+=top.map(x=>'<div class="prod"><div class="thumb">'+(x.p.foto?'<img src="'+esc(x.p.foto)+'">':'📦')+'</div>'+
      '<div class="pinfo"><div class="pname disc-hide">'+esc(x.p.nombre)+'</div>'+
      '<div class="pmeta">'+esc(x.p.cat||'General')+'</div></div>'+
      '<div class="pright"><div class="pprice num">'+x.n+'</div><div class="pmeta">vendidos</div></div></div>').join('');
    h+='</div>';
  }
  if(dormida.length){
    h+='<div class="sectit">💤 Plata dormida <span class="cnt">sin vender hace 60 días</span></div><div class="card">';
    h+=dormida.map(x=>'<div class="prod"><div class="thumb">'+(x.p.foto?'<img src="'+esc(x.p.foto)+'">':'📦')+'</div>'+
      '<div class="pinfo"><div class="pname disc-hide">'+esc(x.p.nombre)+'</div><div class="pmeta">'+stockDe(x.p)+' en stock</div></div>'+
      '<div class="pright"><div class="pprice num" style="color:var(--warn)">'+gsCorto(x.plata)+'</div><div class="pmeta">parado</div></div></div>').join('');
    h+='</div>';
  }
  if(!S.productos.length){
    h+='<div class="card empty"><p>Todavía no cargaste productos.<br>Empezá por ahí y después registrás pedidos.</p>'+
       '<button class="btn btn-brand" style="max-width:240px;margin:8px auto 0" onclick="irA(\'productos\')">Cargar productos</button></div>';
  }
  return h;
}

/* ------------------------------ PRODUCTOS ------------------------------ */
function filaProd(p,compacto){
  const s=stockDe(p), niv=nivelStock(p);
  const cls=niv==='out'?'c-out':(niv==='low'?'c-low':'c-ok');
  const txt=niv==='out'?'sin stock':(s+' en stock');
  const marg=(Number(p.precio)||0)-(Number(p.costo)||0);
  const pctM=p.precio>0?Math.round(marg/p.precio*100):0;
  return '<div class="prod" onclick="abrirProd(\''+p.id+'\')">'+
    '<div class="thumb">'+(p.foto?'<img src="'+esc(p.foto)+'">':'📦')+'</div>'+
    '<div class="pinfo"><div class="pname disc-hide">'+esc(p.nombre)+'</div>'+
    '<div class="pmeta"><span class="chip '+cls+'">'+txt+'</span> '+
      (compacto?'':esc(p.cat||'General')+(marg?' · margen '+pctM+'%':''))+'</div></div>'+
    '<div class="pright"><div class="pprice num">'+gsCorto(p.precio)+'</div>'+
    '<div class="pmeta">'+(compacto?'costo '+gsCorto(p.costo):'gana '+gsCorto(marg))+'</div></div></div>';
}
function vProductos(){
  const cats=['todas'].concat(S.categorias||[]);
  let lista=S.productos.slice();
  if(filtroCat!=='todas')lista=lista.filter(p=>(p.cat||'General')===filtroCat);
  if(buscar){const b=buscar.toLowerCase();lista=lista.filter(p=>(p.nombre||'').toLowerCase().includes(b)||(p.cat||'').toLowerCase().includes(b));}
  lista.sort((a,b)=>{const na=nivelStock(a),nb=nivelStock(b);
    const o={out:0,low:1,ok:2};if(o[na]!==o[nb])return o[na]-o[nb];
    return (a.nombre||'').localeCompare(b.nombre||'');});

  let h='<div class="btn-row"><button class="btn btn-brand" onclick="abrirProd()">+ Nuevo producto</button></div>';
  h+='<div class="field" style="margin-bottom:8px"><input placeholder="🔍 Buscar producto…" value="'+esc(buscar)+'" oninput="buscar=this.value;render();document.querySelector(\'main input\').focus()"></div>';
  h+='<div class="tabs">'+cats.map(c=>'<button class="'+(filtroCat===c?'on':'')+'" onclick="filtroCat=\''+esc(c)+'\';render()">'+(c==='todas'?'Todas':esc(c))+'</button>').join('')+'</div>';
  h+='<div class="sectit">Productos <span class="cnt">'+lista.length+'</span></div>';
  if(!lista.length)h+='<div class="card empty"><p>'+(S.productos.length?'Nada con ese filtro.':'Sin productos todavía.')+'</p></div>';
  else h+='<div class="card">'+lista.map(p=>filaProd(p)).join('')+'</div>';
  return h;
}

/* ------------------------------ PEDIDOS ------------------------------ */
function filaPed(pd){
  const est=pd.estado||'nuevo';
  const cls=est==='cobrado'?'c-ok':(est==='cancelado'?'c-out':'c-gold');
  const nItems=(pd.items||[]).reduce((a,i)=>a+(Number(i.cant)||0),0);
  return '<div class="ped" onclick="abrirPed(\''+pd.id+'\')">'+
    '<div class="pedtop"><div><div class="pedcli disc-hide">'+esc(pd.cliente&&pd.cliente.nombre||'Sin nombre')+'</div>'+
    '<div class="pedsub">'+fmtF(pd.fecha)+' · '+nItems+' art. '+
      (pd.envio&&pd.envio.tipo?'· '+esc(pd.envio.tipo):'')+'</div></div>'+
    '<div style="text-align:right"><div class="pedtot num">'+gs(totalPed(pd))+'</div>'+
    '<span class="chip '+cls+'" style="margin-top:4px">'+ESTLABEL[est]+'</span></div></div></div>';
}
function vPedidos(){
  const ym=mesActivo||ymHoy();
  let lista=S.pedidos.filter(p=>(p.fecha||'').slice(0,7)===ym)
    .sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||(b.creado||0)-(a.creado||0));
  if(filtroEstado==='activos')lista=lista.filter(p=>p.estado!=='cobrado'&&p.estado!=='cancelado');
  else if(filtroEstado!=='todos')lista=lista.filter(p=>p.estado===filtroEstado);
  const R=resumenMes(ym);

  let h='<div class="btn-row"><button class="btn btn-brand" onclick="abrirPed()">+ Nuevo pedido</button></div>';
  h+=selectorMes();
  h+='<div class="kpis" style="margin:6px 0 4px">'+
     '<div class="kpi"><div class="k">Vendido</div><div class="v num">'+gsCorto(R.vendido)+'</div><div class="s">'+R.n+' pedido'+(R.n===1?'':'s')+'</div></div>'+
     '<div class="kpi"><div class="k">Ganancia cobrada</div><div class="v num" style="color:var(--gold)">'+gsCorto(R.ganancia)+'</div><div class="s">'+R.cobrados+' cobrado'+(R.cobrados===1?'':'s')+'</div></div></div>';
  const fs=[['activos','Abiertos'],['cobrado','Cobrados'],['todos','Todos']];
  h+='<div class="tabs">'+fs.map(f=>'<button class="'+(filtroEstado===f[0]?'on':'')+'" onclick="filtroEstado=\''+f[0]+'\';render()">'+f[1]+'</button>').join('')+'</div>';

  else h+='<div class="card">'+lista.map(filaPed).join('')+'</div>';
  return h;
}

/* ------------------------------ CATÁLOGO ------------------------------ */
/* Lo que ella manda por WhatsApp: solo lo que tiene stock, con precio. */
function vCatalogo(){
  const cats=['todas'].concat(S.categorias||[]);
  let lista=S.productos.filter(p=>stockDe(p)>0);
  if(filtroCat!=='todas')lista=lista.filter(p=>(p.cat||'General')===filtroCat);
  lista.sort((a,b)=>(a.cat||'').localeCompare(b.cat||'')||(a.nombre||'').localeCompare(b.nombre||''));

  let h='<div class="card pad" style="background:linear-gradient(135deg,var(--brand-soft),var(--card));border-color:var(--brand)">'+
    '<div style="font-weight:800;font-size:15px;margin-bottom:4px">✨ Catálogo para mandar</div>'+
    '<div class="hint" style="margin-bottom:11px">Solo aparece lo que <b>tenés en stock</b>. Se arma solo con los precios de hoy — no hay que escribir nada a mano.</div>'+
    '<button class="btn btn-gold" onclick="copiarCatalogo()">📋 Copiar lista para WhatsApp</button></div>';
  h+='<div class="tabs">'+cats.map(c=>'<button class="'+(filtroCat===c?'on':'')+'" onclick="filtroCat=\''+esc(c)+'\';render()">'+(c==='todas'?'Todas':esc(c))+'</button>').join('')+'</div>';
  h+='<div class="sectit">Disponibles <span class="cnt">'+lista.length+'</span></div>';
  if(!lista.length)h+='<div class="card empty"><p>No hay productos con stock para mostrar.</p></div>';
  else h+='<div class="catgrid">'+lista.map(p=>
    '<div class="catcard">'+(p.foto?'<img class="catimg" src="'+esc(p.foto)+'">':'<div class="catimg" style="display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--muted)">📦</div>')+
    '<div class="catbody"><div class="catname disc-hide">'+esc(p.nombre)+'</div>'+
    '<div class="catprice num">'+gs(p.precio)+'</div></div></div>').join('')+'</div>';
  return h;
}
function copiarCatalogo(){
  let lista=S.productos.filter(p=>stockDe(p)>0);
  if(filtroCat!=='todas')lista=lista.filter(p=>(p.cat||'General')===filtroCat);
  if(!lista.length){toast('No hay productos con stock');return;}
  const porCat={};
  lista.forEach(p=>{const c=p.cat||'General';(porCat[c]=porCat[c]||[]).push(p);});
  let t='*'+(S.tienda.nombre||'Catálogo')+'*\n_Disponible hoy_\n';
  Object.keys(porCat).sort().forEach(c=>{
    t+='\n*'+c.toUpperCase()+'*\n';
    porCat[c].sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''))
      .forEach(p=>{t+='• '+p.nombre+' — '+gs(p.precio)+'\n';});
  });
  t+='\n📩 Escribinos para hacer tu pedido.';
  if(S.tienda.wa)t+='\n💬 '+S.tienda.wa;
  copiar(t);
}
function copiar(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('Copiado ✓ pegalo en WhatsApp'),()=>copiarViejo(t));
  } else copiarViejo(t);
}
function copiarViejo(t){
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Copiado ✓ pegalo en WhatsApp');}catch(e){toast('No se pudo copiar');}
  document.body.removeChild(ta);
}

function guardarAjustes(){
  S.tienda.nombre=$('aj_nom').value.trim()||'Mi tienda';
  S.tienda.sub=$('aj_sub').value.trim();
  if($('aj_wa'))S.tienda.wa=$('aj_wa').value.trim();
  S.ajustes.minimoDefault=Math.max(0,num($('aj_min').value));
  save();render();toast('Guardado ✓');
}
function agregarCat(){
  const v=$('aj_cat').value.trim();if(!v)return;
  if(S.categorias.includes(v)){toast('Ya existe');return;}
  S.categorias.push(v);save();render();
}
function borrarCat(i){
  const c=S.categorias[i];
  const uso=S.productos.filter(p=>(p.cat||'')===c).length;
  if(uso&&!confirm('Hay '+uso+' producto(s) en "'+c+'". Si la borrás pasan a General. ¿Seguir?'))return;
  S.productos.forEach(p=>{if(p.cat===c)p.cat='General';});
  S.categorias.splice(i,1);
  if(!S.categorias.length)S.categorias=['General'];
  if(filtroCat===c)filtroCat='todas';
  save();render();
}
function subirLogo(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  comprimir(f,200,d=>{S.tienda.logo=d;S.tienda.logoUserSet=true;save();render();toast('Logo cargado ✓');});
}
function bajarRespaldo(){
  const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='respaldo-tienda-'+hoyISO()+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Copia descargada ✓');
}
function subirRespaldo(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.productos))throw 0;
      if(!confirm('Esto reemplaza lo que hay ahora por el respaldo ('+d.productos.length+' productos). ¿Seguir?'))return;
      S=Object.assign(estadoInicial(),d);save();render();toast('Restaurado ✓');
    }catch(e){toast('El archivo no es un respaldo válido');}
  };
  r.readAsText(f);inp.value='';
}
function borrarTodo(){
  if(!confirm('Esto borra productos, pedidos y ajustes. ¿Seguro?'))return;
  if(!confirm('Última confirmación: sin respaldo no hay vuelta atrás.'))return;
  S=estadoInicial();save();render();toast('Todo borrado');
}

function textoMargen(c,v){

/* Las fotos se guardan achicadas: si no, el almacenamiento del navegador
   se llena con 15 productos. 600px de lado y calidad 0.72 alcanza de sobra. */
function comprimir(file,max,cb){
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;}
      else if(h>max){w=Math.round(w*max/h);h=max;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',.72));
    };
    img.onerror=()=>toast('No se pudo leer la imagen');
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

/* Al guardar se descuenta el stock una sola vez: se compara contra lo que
   el pedido ya tenía descontado antes (por si se editan las cantidades). */
function guardarPed(){
  leerPedForm();
  if(!borrador.items.length){toast('Agregá al menos un producto');return;}
  const previo=editPed?(S.pedidos.find(p=>p.id===editPed)||{items:[]}):{items:[]};
  const antes={},ahora={};
  if(previo.estado!=='cancelado')(previo.items||[]).forEach(i=>antes[i.prodId]=(antes[i.prodId]||0)+i.cant);
  if(borrador.estado!=='cancelado')borrador.items.forEach(i=>ahora[i.prodId]=(ahora[i.prodId]||0)+i.cant);
  Object.keys(Object.assign({},antes,ahora)).forEach(pid=>{
    const dif=(ahora[pid]||0)-(antes[pid]||0);
    if(!dif)return;
    const p=prod(pid);if(!p)return;
    if(p.variantes&&p.variantes.length){
      /* con variantes se descuenta de la primera que tenga stock */
      let resta=dif;
      if(resta>0){ for(const v of p.variantes){ const q=Math.min(v.stock,resta); v.stock-=q; resta-=q; if(resta<=0)break; } }
      else { p.variantes[0].stock+=(-resta); }
    } else {
      p.stock=Math.max(0,(Number(p.stock)||0)-dif);
    }
  });
  if(borrador.id){
    const i=S.pedidos.findIndex(p=>p.id===borrador.id);
    if(i>=0)S.pedidos[i]=borrador;
  }else{
    borrador.id=uid();borrador.creado=Date.now();
    S.pedidos.push(borrador);
  }
  save();cerrarModal();render();toast('Pedido guardado ✓');
}
function borrarPed(){
  if(!confirm('¿Borrar este pedido? El stock vuelve a como estaba.'))return;
  const pd=S.pedidos.find(p=>p.id===borrador.id);
  if(pd&&pd.estado!=='cancelado')(pd.items||[]).forEach(i=>{
    const p=prod(i.prodId);if(!p)return;
    if(p.variantes&&p.variantes.length)p.variantes[0].stock+=i.cant;
    else p.stock=(Number(p.stock)||0)+i.cant;
  });
  S.pedidos=S.pedidos.filter(p=>p.id!==borrador.id);
  save();cerrarModal();render();toast('Pedido borrado');
}
function copiarResumenPedido(){
  leerPedForm();

  let t='*'+(S.tienda.nombre||'Pedido')+'*\n';
  if(pd.cliente.nombre)t+='Para: '+pd.cliente.nombre+'\n';
  t+='\n';
  pd.items.forEach(i=>{t+=i.cant+'x '+i.nombre+' — '+gs(i.precio*i.cant)+'\n';});
  if(pd.envio.costo&&pd.envio.loPaga==='cliente')t+='Envío — '+gs(pd.envio.costo)+'\n';
  t+='\n*TOTAL: '+gs(totalPed(pd))+'*';
  if(pd.envio.guia)t+='\nSeguimiento: '+pd.envio.guia;
  copiar(t);
}

}
function cambiarRolUsuario(uid, rolNuevo){
  _fbdb().ref('permisos/'+uid+'/rol').set(rolNuevo).then(()=>{ toast('Rol actualizado'); abrirPermisos(); }).catch(e=>toast('No se pudo'));
}
function quitarUsuario(uid){
  if(!confirm('¿Quitar el acceso de este usuario?')) return;
  _fbdb().ref('permisos/'+uid).remove().then(()=>{ toast('Acceso quitado'); abrirPermisos(); }).catch(e=>toast('No se pudo'));
}

/* ============================ ACCESO Y NUBE (Firebase) ============================ */
let _fbAuth=null, _fbdbRef=null;
function _fbdb(){ return _fbdbRef; }
const emailKey=e=>String(e||'').toLowerCase().replace(/[.#$\[\]]/g,',');

function gate(html){ $('gateBody').innerHTML=html; }
function mostrarGate(){ $('gate').classList.remove('oculto'); document.body.classList.add('cargando'); }
function ocultarGate(){ $('gate').classList.add('oculto'); document.body.classList.remove('cargando'); }

function gateLogin(){
  mostrarGate();
  gate('<div class="gate-tag">Sistema de gestión</div>'+
    '<button class="gbtn" onclick="entrarGoogle()">'+
    '<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>'+
    'Continuar con Google</button>');
}
function gateCargando(txt){ mostrarGate(); gate('<div class="spin"></div>'+(txt?'<div class="gate-msg">'+esc(txt)+'</div>':'')); }
function gateSinAcceso(email){
  mostrarGate();
  gate('<div class="gate-msg"><b>Todavía no tenés acceso.</b><br>Le avisamos al administrador para que te habilite. '+
    'Probá de nuevo en un rato.</div>'+
    '<div class="gate-mail">'+esc(email)+'</div>'+
    '<button class="gbtn" style="max-width:220px;margin-top:8px" onclick="location.reload()">Reintentar</button>'+
    '<button class="linkbtn" onclick="salir()">Salir</button>');
}
function gateError(msg){
  mostrarGate();
  gate('<div class="gate-msg"><b>No se pudo iniciar sesión.</b><br>'+esc(msg||'')+'</div>'+
    '<button class="gbtn" style="max-width:220px" onclick="entrarGoogle()">Reintentar</button>');
}

function entrarGoogle(){
  gateCargando('Conectando…');
  const prov=new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({prompt:'select_account'});
  _fbAuth.signInWithPopup(prov).catch(err=>{
    if(err && err.code==='auth/popup-blocked'){ _fbAuth.signInWithRedirect(prov); return; }
    if(err && (err.code==='auth/popup-closed-by-user'||err.code==='auth/cancelled-popup-request')){ gateLogin(); return; }
    gateError((err&&err.message)||'Error');
  });
}
function salir(){ if(_fbAuth) _fbAuth.signOut().then(()=>location.reload()); }

/* Resolver el rol del usuario: súper admin por correo, o lo que diga /permisos/<uid>. */
function resolverRol(u){
  if((u.email||'').toLowerCase()===SUPER_ADMIN){ return Promise.resolve('super'); }
  return _fbdb().ref('permisos/'+u.uid+'/rol').get().then(s=> s.exists()? s.val() : null );
}
/* Registrar un pedido de acceso para que el súper admin lo apruebe. */
function pedirAcceso(u){
  try{ _fbdb().ref('solicitudes/'+u.uid).set({email:u.email||'', nombre:u.displayName||'', ts:Date.now()}); }catch(e){}
}

/* Al entrar con acceso: traer datos de la nube (o migrar los locales) y escuchar cambios en vivo. */
function arrancarApp(u){
  usuario=u;
  gateCargando('Cargando tu tienda…');
  const ref=_fbdb().ref('tienda');
  ref.get().then(snap=>{
    if(snap.exists()){
      S=Object.assign(estadoInicial(), snap.val());
    }else{
      /* primera vez en la nube: si hay datos locales, subirlos; si no, semilla demo */
      if(!load()){ S=estadoInicial(); cargarDemo(); }
      guardarNube();
    }
    if(S.tienda && S.tienda.logo && !S.tienda.logoUserSet){ S.tienda.logo=''; }
    _fbReady=true;
    try{ localStorage.setItem(LSKEY,JSON.stringify(S)); }catch(e){}
    /* escucha en vivo: multi-dispositivo */
    ref.on('value', snap2=>{
      if(!snap2.exists()) return;
      const remoto=JSON.stringify(snap2.val()), local=JSON.stringify(S);
      if(remoto===local) return;             /* nuestro propio eco */
      if(document.getElementById('modal') && $('modal').innerHTML.trim()) return; /* no pisar mientras se edita */
      _remoteApplying=true;
      S=Object.assign(estadoInicial(), snap2.val());
      try{ localStorage.setItem(LSKEY,JSON.stringify(S)); }catch(e){}
      render();
      _remoteApplying=false;
    });
    ocultarGate();
    render();
  }).catch(err=>{ gateError('No se pudo leer la base. '+((err&&err.message)||'')); });
}

function iniciarFirebase(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    _fbAuth=firebase.auth();
    _fbdbRef=firebase.database();
    _fbAuth.onAuthStateChanged(function(u){
      if(!u){ rol=null; usuario=null; gateLogin(); return; }
      gateCargando('Verificando acceso…');
      resolverRol(u).then(r=>{
        if(r){ rol=r; arrancarApp(u); }
        else { rol=null; pedirAcceso(u); gateSinAcceso(u.email||''); }
      }).catch(err=>{ gateError((err&&err.message)||'Error de permisos'); });
    });
  }catch(e){ gateError('No se pudo iniciar Firebase. '+((e&&e.message)||'')); }
}

/* ------------------------------ arranque ------------------------------ */
function boot(){
  mesActivo=ymHoy();
  document.documentElement.style.setProperty('--satin','url("'+TEX_SATIN+'")');
  $('gateLogo').src=LOGO_WORD;
  try{ discreto=localStorage.getItem('tienda_discreto')==='1'; }catch(e){}
  document.body.classList.toggle('discreto',discreto);
  document.querySelectorAll('.js-disc').forEach(b=>b.classList.toggle('on',discreto));
  gateCargando('');
  if(window.firebase && firebase.initializeApp){ iniciarFirebase(); }
  else { gateError('No cargó Firebase (revisá tu conexión).'); }
}
Object.assign(window,{irA,cambiarMes,mesHoy,abrirProd,pintarProd,guardarProd,borrarProd,previewMargen,agregarVariante,fotoProd,
  abrirPed,pintarPed,guardarPed,borrarPed,abrirElegirProd,elegirProd,filtrarElegir,cambiarCant,actualizarTotPed,
  copiarResumenPedido,copiarCatalogo,cerrarModal,toggleDiscreto,guardarAjustes,agregarCat,borrarCat,subirLogo,
  bajarRespaldo,subirRespaldo,borrarTodo,cargarDemo,num,
  entrarGoogle,salir,abrirPermisos,aprobarSolicitud,cambiarRolUsuario,quitarUsuario});
boot();
</script>
